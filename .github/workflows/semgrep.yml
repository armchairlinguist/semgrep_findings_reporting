on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/semgrep.yml
name: Semgrep
jobs:
  requirements_generation:
    name: generateRequirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate requirements file
        run: |
          pip3 install pip-tools
          pip install pandas requests fpdf pdfkit PyPDF2 plotly
          pip list --format=freeze > requirements.txt
      - name: Upload Requirements File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirementstxt
          path: requirements.txt
  semgrep_scan:
    needs: requirements_generation
    name: Semgrep scan
    runs-on: ubuntu-20.04
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep:pro-pr-3036
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact from previous job
        uses: actions/download-artifact@v4
        with:
          name: requirementstxt
      - run: |
          git config --global --add safe.directory /__w/semgrep_findings_reporting/semgrep_findings_reporting
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add requirements.txt 
          git commit -m 'commit for scan' requirements.txt
          semgrep ci --supply-chain --verbose
